<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Seftekra concept render placeholder">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#ff5e00" stop-opacity="0.35"/>
      <stop offset="18%" stop-color="#cc3300" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#4d1300" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- perspective solar array -->
  <g opacity="0.55" transform="translate(0,120)">
    <!-- row 1 -->
    <g transform="skewY(-8)">
      <rect x="120" y="200" width="1360" height="150" fill="url(#panel)" stroke="#ffd700" stroke-opacity="0.12"/>
      <rect x="120" y="200" width="1360" height="150" fill="none" stroke="#ffd700" stroke-opacity="0.08"/>
      <!-- cell grid -->
      <g stroke="#ffd700" stroke-opacity="0.10" stroke-width="1">
        <line x1="256" y1="200" x2="256" y2="350"/>
        <line x1="392" y1="200" x2="392" y2="350"/>
        <line x1="528" y1="200" x2="528" y2="350"/>
        <line x1="664" y1="200" x2="664" y2="350"/>
        <line x1="800" y1="200" x2="800" y2="350"/>
        <line x1="936" y1="200" x2="936" y2="350"/>
        <line x1="1072" y1="200" x2="1072" y2="350"/>
        <line x1="1208" y1="200" x2="1208" y2="350"/>
        <line x1="1344" y1="200" x2="1344" y2="350"/>
        <line x1="120" y1="275" x2="1480" y2="275"/>
      </g>
    </g>
    <!-- row 2 -->
    <g transform="skewY(-8) translate(0,170)">
      <rect x="120" y="200" width="1360" height="150" fill="url(#panel)" stroke="#ffd700" stroke-opacity="0.10"/>
      <g stroke="#ffd700" stroke-opacity="0.08" stroke-width="1">
        <line x1="256" y1="200" x2="256" y2="350"/>
        <line x1="528" y1="200" x2="528" y2="350"/>
        <line x1="800" y1="200" x2="800" y2="350"/>
        <line x1="1072" y1="200" x2="1072" y2="350"/>
        <line x1="1344" y1="200" x2="1344" y2="350"/>
        <line x1="120" y1="275" x2="1480" y2="275"/>
      </g>
    </g>
  </g>

  <!-- horizon grid lines -->
  <g stroke="#ffd700" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="700" x2="1600" y2="700"/>
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="0" y1="820" x2="1600" y2="820"/>
  </g>

  <!-- gold scan line -->
  <rect x="0" y="448" width="1600" height="1.5" fill="url(#gold)" opacity="0.5"/>

  <!-- wordmark -->
  <text x="80" y="820" font-family="Space Grotesk, Inter, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#ffd700" opacity="0.5">SEFTEKRA</text>

  <!-- slot label -->
  <text x="1520" y="820" text-anchor="end" font-family="Inter, sans-serif" font-size="16" letter-spacing="2" fill="#a3a3a3" opacity="0.6">CONCEPT RENDER</text>
</svg>
